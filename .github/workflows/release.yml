name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-amd64
            goos: windows
            goarch: amd64
            artifact: badrename-windows-amd64.exe
            extra_ldflags: -H=windowsgui
          - os: ubuntu-latest
            label: linux-amd64
            goos: linux
            goarch: amd64
            artifact: badrename-linux-amd64
            extra_ldflags: ""
          - os: macos-latest
            label: darwin-arm64
            goos: darwin
            goarch: arm64
            artifact: badrename-darwin-arm64
            extra_ldflags: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK 3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - name: Test
        run: go test ./...
      - name: Build standalone executable
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -tags mygo_noinspector \
            -ldflags "-s -w ${{ matrix.extra_ldflags }} -X github.com/egoist/mygo.production=1 -X github.com/egoist/mygo.packageName=BadRename -X github.com/egoist/mygo.packageVersion=0.1.0 -X github.com/egoist/mygo.packageIdentifier=com.badrename.app" \
            -o dist/${{ matrix.artifact }} .
      - uses: actions/upload-artifact@v4
        with:
          name: badrename-${{ matrix.label }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: badrename-*
          generate_release_notes: true
