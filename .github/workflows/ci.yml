name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK 3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - name: gofmt check
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: MyGo vet
        run: go tool mygo vet ./internal/ui
      - name: go test
        run: go test ./...
